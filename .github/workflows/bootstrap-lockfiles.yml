name: Bootstrap Lockfiles

on:
  push:
    branches:
      - foundation-hardening

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate frontend lockfile
        working-directory: EngineData/Frontend/RustApp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate Rust workspace lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfiles
        run: |
          git add Cargo.lock EngineData/Frontend/RustApp/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock dependency resolution"
          git push origin HEAD:foundation-hardening
