name: Refresh Tauri Dialog Lock

on:
  push:
    branches:
      - develop
    paths:
      - EngineData/Frontend/RustApp/src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve Tauri dialog dependency
        run: cargo check --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- EngineData/Frontend/RustApp/src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EngineData/Frontend/RustApp/src-tauri/Cargo.lock
          git commit -m "chore: refresh Tauri dialog lock [skip ci]"
          git push origin HEAD:develop
