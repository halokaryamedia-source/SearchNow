name: Repository Verify

on:
  push:
    branches:
      - develop
      - Local
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository contracts
        run: python tools/verify_repository.py
      - name: Verify Rust source formatting
        run: cargo fmt --all -- --check
      - name: Verify backend core
        run: |
          cargo test -p searchnow-core --locked
          cargo clippy -p searchnow-core --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci --no-audit --no-fund
      - name: Verify frontend architecture and build
        working-directory: EngineData/Frontend/RustApp
        run: npm run validate:quick

  windows-readiness:
    name: Windows Rust/Tauri compile gate
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify RustCore on Windows
        run: cargo test -p searchnow-core --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install locked frontend dependencies on Windows
        working-directory: EngineData/Frontend/RustApp
        run: npm ci --no-audit --no-fund
      - name: Build frontend for Tauri context
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Verify Tauri crate compiles on Windows
        run: cargo check -p searchnow --locked
