name: Stable Release Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Stable release gate
    runs-on: ubuntu-latest
    steps:
      - name: Require Local release source
        if: github.event_name == 'pull_request'
        run: |
          test "${{ github.head_ref }}" = "Local" || {
            echo "Stable promotion must come from Local." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm install --no-audit --no-fund
      - name: Verify frontend architecture and build
        working-directory: EngineData/Frontend/RustApp
        run: npm run validate:quick
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml -- --check

      - name: Stable policy reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Release source: Local."
          echo "Required merge method: merge commit."
